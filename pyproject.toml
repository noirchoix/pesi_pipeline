[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pesi-v2"
version = "0.3.0"
description = "PESI-KG production research backend for plant enzyme-state intervention, herbicide target rules and bioherbicide synergy"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "networkx>=3.0",
  "openpyxl>=3.1",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.25",
  "typer>=0.9",
  "requests>=2.31",
  "rdkit>=2023.9.0",
  "torch>=2.0",
  "pyarrow>=14.0",
  "duckdb>=0.10",
  "pydantic>=2.0"
]

[tool.setuptools.packages.find]
include = ["pesi*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.package-data]
"pesi.config" = ["*.yaml"]
